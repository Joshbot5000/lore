<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Earthbound Heroes</title>
<meta name="description" content="An open-world superhero sandbox on the real planet Earth. Works offline.">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Earthbound">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#eef4ff;--dim:#9fb0c8;--glass:rgba(8,12,20,.55);--line:rgba(255,255,255,.14);--hero:#37f5d6;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05070c;color:var(--ink);font:500 14px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
#hud>*{position:absolute}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
#loc{left:calc(12px + var(--sal));top:calc(10px + var(--sat));padding:8px 12px;max-width:min(60vw,340px)}
#place{font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
#stars{left:50%;top:calc(12px + var(--sat));transform:translateX(-50%);display:flex;gap:5px;font-size:22px;filter:drop-shadow(0 2px 6px #000)}
#stars i{font-style:normal;color:rgba(255,255,255,.18)}#stars i.on{color:#ffd24a;text-shadow:0 0 12px #ffb400}
#stars.search i.on{animation:blink .7s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
#tr{right:calc(10px + var(--sar));top:calc(10px + var(--sat));display:flex;gap:8px;align-items:flex-start}
#mini{width:132px;height:132px;border-radius:50%;border:1px solid var(--line);background:rgba(8,12,20,.6)}
#trb{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#trb button{width:42px;height:42px;font-size:19px;border-radius:12px}
#bars{left:calc(12px + var(--sal));bottom:calc(14px + var(--sab));width:min(250px,42vw);padding:9px 11px}
#heroName{font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--hero);margin-bottom:6px;display:flex;justify-content:space-between}
#heroName span{color:var(--dim);letter-spacing:.02em;font-weight:500}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;border-radius:4px;transition:width .12s}
#hp i{background:linear-gradient(90deg,#ff5a6a,#ff9a7a)}#en i{background:var(--hero)}
#powers{left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
.pw{position:relative;width:62px;height:62px;border-radius:16px;overflow:hidden;text-align:center}
.pw b{display:block;font-size:24px;line-height:38px;color:var(--hero);font-weight:400}.pw small{display:block;font-size:9px;color:var(--dim);line-height:1;white-space:nowrap}
.pw kbd{position:absolute;right:5px;top:3px;font:600 10px ui-monospace,monospace;color:var(--dim)}
.pw u{position:absolute;inset:auto 0 0 0;height:0;background:rgba(0,0,0,.62);text-decoration:none}
.pw.trav{border-color:var(--hero)}
#speedo{right:calc(16px + var(--sar));bottom:calc(16px + var(--sab));font:800 34px/1 ui-sans-serif,system-ui;font-variant-numeric:tabular-nums;text-shadow:0 2px 10px #000;display:none}#speedo small{font-size:12px;color:var(--dim);margin-left:4px}
#prompt{left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);padding:7px 14px;font-weight:600;display:none;white-space:nowrap}
#toasts{left:50%;top:calc(58px + var(--sat));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,420px)}
.toast{padding:8px 14px;text-align:center;animation:tin .25s ease-out}.toast b{display:block}.toast span{color:var(--dim);font-size:12px}@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#cross{left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#hurt{inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,20,40,.55));opacity:0;transition:opacity .25s}
#stickZone{left:0;bottom:0;width:45%;height:62%;pointer-events:auto;display:none}
#stick{width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);display:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.3)}
#tb{right:calc(10px + var(--sar));bottom:calc(10px + var(--sab));width:232px;height:210px;display:none;pointer-events:none}
.tbn{position:absolute;border-radius:50%;pointer-events:auto;font-weight:800;font-size:11px;letter-spacing:.05em;display:grid;place-items:center;background:rgba(10,14,22,.5);border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tbn.dn{background:rgba(255,255,255,.3)}
#t-jump{right:0;bottom:0;width:86px;height:86px}#t-trav{right:92px;bottom:8px;width:76px;height:76px;border-color:var(--hero);color:var(--hero)}
#t-atk{right:20px;bottom:94px;width:70px;height:70px}#t-dodge{right:98px;bottom:92px;width:54px;height:54px}#t-use{right:160px;bottom:66px;width:54px;height:54px;display:none;border-color:#ffd24a;color:#ffd24a}
.touch #stickZone,.touch #tb{display:block}.touch #cross{opacity:.5}.touch .pw kbd{display:none}
.touch #powers{left:auto;right:calc(250px + var(--sar));transform:none;bottom:calc(12px + var(--sab))}.touch .pw{width:54px;height:54px}.touch .pw b{line-height:34px;font-size:21px}
.touch #bars{bottom:auto;top:calc(66px + var(--sat));width:170px}
@media (max-width:700px){#mini{width:96px;height:96px}#trb button{width:38px;height:38px}.touch #powers{right:auto;left:50%;transform:translateX(-50%);bottom:calc(228px + var(--sab))}}
.screen{position:fixed;inset:0;display:none;z-index:5}
.screen.on{display:flex}
#title{flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(20px + var(--sat)) 16px calc(22px + var(--sab));background:linear-gradient(180deg,rgba(5,7,12,.25),rgba(5,7,12,.2) 35%,rgba(5,7,12,.93) 78%);overflow:auto}
#title h1{font:900 clamp(34px,7.5vw,84px)/.92 ui-sans-serif,system-ui;letter-spacing:-.03em;margin:0;text-align:center;text-shadow:0 6px 40px rgba(0,0,0,.6)}
#title h1 em{font-style:normal;color:var(--hero)}
#title p.sub{color:var(--dim);margin:10px 0 18px;text-align:center;max-width:560px}
#heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(880px,100%)}
.hero{padding:10px 12px;text-align:left;border-radius:14px;transition:transform .15s,border-color .15s}.hero.sel{border-color:var(--c);transform:translateY(-3px);box-shadow:0 8px 30px -12px var(--c)}
.hero b{display:block;color:var(--c);letter-spacing:.12em;font-size:13px}.hero i{display:block;font-style:normal;font-size:11px;color:var(--dim)}.hero span{display:block;font-size:12px;margin-top:5px;color:#cfd9ea}
@media (max-width:760px){#heroes{grid-template-columns:repeat(2,minmax(0,1fr))}.hero span{display:none}}
#starts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn{padding:11px 18px;border-radius:12px;font-weight:700;pointer-events:auto}.btn.primary{background:var(--hero);color:#04110f;border-color:transparent}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#05070c;z-index:9;transition:opacity .5s;text-align:center;color:var(--dim)}#loading b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
#mapUI{position:absolute;inset:0;pointer-events:none}
#mapUI>*{position:absolute;pointer-events:auto}
#mapTop{left:calc(12px + var(--sal));top:calc(12px + var(--sat));right:calc(12px + var(--sar));display:flex;gap:8px;pointer-events:none}
#mapTop>*{pointer-events:auto}
#search{flex:1;max-width:340px;padding:11px 14px;color:var(--ink);font:inherit;outline:0;user-select:text;-webkit-user-select:text}
#results{left:calc(12px + var(--sal));top:calc(62px + var(--sat));width:min(340px,80vw);display:none;overflow:hidden}
#results button{display:block;width:100%;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}#results button span{color:var(--dim);font-size:12px;margin-left:6px}
#mapInfo{left:50%;bottom:calc(18px + var(--sab));transform:translateX(-50%);padding:12px 14px;width:min(430px,94vw);text-align:center}
#mapInfo b{display:block;font-size:16px}#mapInfo span{display:block;color:var(--dim);font-size:12px;margin:2px 0 10px}
#mapInfo div{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#labels{inset:0;pointer-events:none!important;overflow:hidden}
#labels span{position:absolute;font-size:11px;font-weight:600;text-shadow:0 1px 4px #000,0 0 8px #000;transform:translate(8px,-50%);white-space:nowrap;pointer-events:none}
#labels span::before{content:"";position:absolute;left:-10px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:#ffd24a}
#pause{align-items:center;justify-content:center;background:rgba(5,7,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:auto;padding:16px}
#pauseBox{padding:18px 20px;width:min(560px,100%);max-height:100%;overflow:auto}
#pauseBox h2{margin:0 0 10px;font-size:20px}#pauseBox table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}#pauseBox td{padding:4px 0;border-bottom:1px solid var(--line)}#pauseBox td:first-child{color:var(--dim);width:44%}
#pauseBox .row{display:flex;gap:8px;flex-wrap:wrap}
#stats{color:var(--dim);font-size:12px;margin:10px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="loc" class="glass"><div id="place">—</div><div id="meta"></div></div>
  <div id="stars"></div>
  <div id="tr"><canvas id="mini" width="264" height="264"></canvas><div id="trb"><button id="b-map" class="glass" aria-label="World map">🌍</button><button id="b-hero" class="glass" aria-label="Switch hero">⇄</button><button id="b-pause" class="glass" aria-label="Pause">Ⅱ</button></div></div>
  <div id="bars" class="glass"><div id="heroName"></div><div class="bar" id="hp"><i></i></div><div class="bar" id="en"><i></i></div></div>
  <div id="powers"></div>
  <div id="speedo">0<small>km/h</small></div>
  <div id="prompt" class="glass"></div>
  <div id="toasts"></div>
  <div id="cross"></div>
  <div id="hurt"></div>
  <div id="stickZone"></div><div id="stick"><i></i></div>
  <div id="tb"><button class="tbn" id="t-jump">JUMP</button><button class="tbn" id="t-trav">HOLD</button><button class="tbn" id="t-atk">HIT</button><button class="tbn" id="t-dodge">DODGE</button><button class="tbn" id="t-use">CAR</button></div>
</div>
<div id="title" class="screen">
  <h1>EARTHBOUND <em>HEROES</em></h1>
  <p class="sub">The whole planet is the map. Real coastlines, mountains and 7,300 real cities, under the real sky and weather right now.</p>
  <div id="heroes"></div>
  <div id="starts"><button class="btn primary" id="s-go">Play</button><button class="btn glass" id="s-here">Start where I am</button><button class="btn glass" id="s-map">Choose on the globe</button></div>
</div>
<div id="mapScreen" class="screen"><div id="mapUI">
  <div id="labels"></div>
  <div id="mapTop"><input id="search" class="glass" placeholder="Search 7,300 cities…" autocomplete="off" spellcheck="false"><button class="btn glass" id="m-close">Close</button></div>
  <div id="results" class="glass"></div>
  <div id="mapInfo" class="glass"><b id="mi-t">Tap anywhere on Earth</b><span id="mi-s">Drag to spin, pinch or scroll to zoom</span><div><button class="btn primary" id="m-go" style="display:none">Travel here</button><button class="btn glass" id="m-city" style="display:none"></button></div></div>
</div></div>
<div id="pause" class="screen"><div id="pauseBox" class="glass">
  <h2>Paused</h2>
  <div id="stats"></div>
  <table id="keys"></table>
  <div class="row"><button class="btn primary" id="p-resume">Resume</button><button class="btn glass" id="p-map">World map</button><button class="btn glass" id="p-q">Graphics: Auto</button><button class="btn glass" id="p-mute">Sound: On</button></div>
</div></div>
<div id="loading"><div><b>Earthbound Heroes</b><span id="loadMsg">Loading the planet…</span></div></div>
<script>/*BUNDLE*/</script>
</body>
</html>
